[package]
name = "taskbar-battery"
version = "0.7.3"
edition = "2021"
description = "Battery levels of wireless devices on the Windows taskbar"
license = "MIT"
repository = "https://github.com/renanleonel/windows-taskbar-battery"

[dependencies]
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WinRT Bluetooth APIs.
windows = { version = "0.58", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Data_Xml_Dom",
    "Devices_Power",
    "Foundation",
    "Foundation_Collections",
    "Gaming_Input",
    "Storage_Streams",
    "System_Power",
    "UI_Notifications",
    "Win32_System_Com",
] }
# Plain Win32 (window, GDI, registry, SetupAPI, clipboard).
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Icon, version info and manifest (see build.rs).
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
