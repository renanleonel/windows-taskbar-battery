name: Bug report
description: Something isn't working (widget placement, crashes, menu, notifications…).
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected vs. what happened. A screenshot of the taskbar helps a lot for placement issues.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start taskbar-battery
        2. ...
  - type: input
    id: version
    attributes:
      label: taskbar-battery version
      placeholder: v0.7.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows build
      description: Run `winver`.
      placeholder: Windows 11 24H2 (26100.2033)
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Monitors and scaling, taskbar settings (alignment, auto-hide), other taskbar tools (TrafficMonitor, ExplorerPatcher, Windhawk…).
