name: Release

# Push a tag like v0.1.0 to build and publish a release with the exe attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - uses: softprops/action-gh-release@v3
        with:
          files: target/release/taskbar-battery.exe
          generate_release_notes: true
          # Tags like v0.7.1-rc.1 are test builds: publish them as pre-releases, never "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
